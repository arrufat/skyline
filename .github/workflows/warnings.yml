# Publishes the site with a fresh copy of MeteoAlarm's feeds under /warnings/meteoalarm/ and of NASA FIRMS' fires at
# /fires/detections.json, which the browser app reads, as neither lets a page on another site read them. Pages' source must
# be "GitHub Actions".
name: Publish with Europe's warnings

on:
  schedule:
    # Off the quarter hours, when GitHub drops the most scheduled runs.
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.redeploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Copy MeteoAlarm's feeds
        id: mirror
        run: |
          python3 tools/mirror_meteoalarm.py warnings/meteoalarm | tee mirror.log
          echo "result=$(tail -n 1 mirror.log)" >> "$GITHUB_OUTPUT"
          rm mirror.log

      - name: Copy NASA FIRMS' fires
        id: fires
        run: |
          python3 tools/mirror_firms.py fires/detections.json | tee fires.log
          echo "result=$(tail -n 1 fires.log)" >> "$GITHUB_OUTPUT"
          rm fires.log

      # A scheduled run with nothing new leaves the site as it is.
      - name: Pack the site
        if: github.event_name != 'schedule' || steps.mirror.outputs.result == 'changed' || steps.fires.outputs.result == 'changed'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
          # Each attempt's own, as a re-run's deploy refuses a run with several of one name.
          name: github-pages-${{ github.run_attempt }}
          # For .well-known/assetlinks.json, which hands the app's links to the Android app.
          include-hidden-files: true

      # Publish at times can't find the artifact Pack uploaded a moment before, though it's there, so it tries again.
      - name: Publish
        id: deploy
        if: github.event_name != 'schedule' || steps.mirror.outputs.result == 'changed' || steps.fires.outputs.result == 'changed'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before publishing again
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Publish again
        id: redeploy
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
